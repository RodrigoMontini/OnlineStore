<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
  <title>Entrar · {{ loja.loja_nome }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="login">
  <div class="caixa">
    <div class="marca">{{ loja.loja_nome }}</div>
    <p class="mudo">Painel da loja</p>
    {% if erro %}<div class="flash erro">{{ erro }}</div>{% endif %}
    <form class="form" method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
      <button class="botao largo" type="submit">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
