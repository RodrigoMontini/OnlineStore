<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
  <title>{% block titulo %}Impressão{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #111; background: #eee; font-size: 12px; }
    .folha { background: #fff; margin: 12px auto; padding: 10mm; width: {% block largura %}210mm{% endblock %}; min-height: {% block altura %}auto{% endblock %}; }
    .barra { background: #fff; padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
    .barra button, .barra a { font: 600 14px Arial; padding: 8px 16px; border-radius: 999px; border: 1px solid #999; background: #fff; cursor: pointer; text-decoration: none; color: #111; margin: 0 4px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #333; padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; font-size: 11px; }
    .num { text-align: right; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    h2 { font-size: 13px; margin: 12px 0 4px; }
    .caixa { border: 1.5px solid #111; padding: 6px 8px; margin-bottom: 6px; }
    .rotulo { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
    .grande { font-size: 15px; font-weight: 700; }
    .mono { font-family: "Courier New", monospace; }
    .muted { color: #666; }
    @media print { body { background: #fff; } .barra { display: none; } .folha { margin: 0; width: auto; padding: 0; } @page { margin: 8mm; } }
  </style>
</head>
<body data-imprimir="{{ '1' if request.query_params.get('imprimir') else '' }}">
<div class="barra"><button onclick="window.print()">Imprimir</button><a href="javascript:window.close()">Fechar</a></div>
<div class="folha">{% block conteudo %}{% endblock %}</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
